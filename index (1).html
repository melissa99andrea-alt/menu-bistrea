<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Menú Bistrea</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
#menu{position:fixed;inset:0;width:100vw;height:100vh;object-fit:contain;background:#000}
</style>
</head>
<body>
<img id="menu" src="pantalla-1.png" alt="Menú Bistrea">
<script>
const slides=['pantalla-1.png','pantalla-2.png','pantalla-3.png','pantalla-4.png'];
slides.forEach(s=>{const i=new Image();i.src=s;});
let n=0;
setInterval(()=>{n=(n+1)%slides.length;document.getElementById('menu').src=slides[n];},15000);
</script>
</body>
</html>
