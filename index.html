<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Menú Bistrea</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #f6f1e7;
    }
    #menu {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      object-fit: contain;
      object-position: center;
      background: #f6f1e7;
      opacity: 1;
      transition: opacity .6s ease;
    }
  </style>
</head>
<body>
  <img id="menu" src="pantalla1.png" alt="Menú Bistrea" />
  <script>
    const images = ['pantalla1.png', 'pantalla2.png', 'pantalla3.png'];
    images.forEach(src => { const i = new Image(); i.src = src; });

    let current = 0;
    const menu = document.getElementById('menu');

    setInterval(() => {
      menu.style.opacity = '0';
      setTimeout(() => {
        current = (current + 1) % images.length;
        menu.src = images[current];
        menu.style.opacity = '1';
      }, 600);
    }, 15000);
  </script>
</body>
</html>
